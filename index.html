<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anniversary Collage – Photo Collage Maker</title>
    <meta name="description" content="Create a photo collage for your 1st through 9th anniversary and download a 2400 × 3000 PNG. Photos stay on your device.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Anniversary Collage">
    <meta property="og:title" content="Anniversary Collage – Photo Collage Maker">
    <meta property="og:description" content="Create a photo collage for your 1st through 9th anniversary and download a 2400 × 3000 PNG. Photos stay on your device.">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <aside>
            <div class="panel-header">
                <h1 data-i18n="title">Anniversary Collage</h1>
                <select id="language" aria-label="Language">
                    <option value="tr" lang="tr">Türkçe</option>
                    <option value="en" lang="en" selected>English</option>
                </select>
            </div>
            <p data-i18n="intro">Choose an anniversary year and add your photos to fill its number.</p>
            <label for="year" data-i18n="yearLabel">Anniversary year</label>
            <select id="year" aria-describedby="count">
                <option value="1">1st year</option>
                <option value="2">2nd year</option>
                <option value="3">3rd year</option>
                <option value="4">4th year</option>
                <option value="5">5th year</option>
                <option value="6">6th year</option>
                <option value="7">7th year</option>
                <option value="8">8th year</option>
                <option value="9">9th year</option>
            </select>
            <div id="drop" tabindex="0" role="button">
                <span data-i18n="drop">Drag photos here or choose files</span>
                <input id="files" type="file" accept="image/*" multiple hidden>
            </div>
            <small id="count" aria-live="polite"></small>
            <label for="heading" data-i18n="headingLabel">Vertical text</label>
            <input id="heading" value="YEAR" maxlength="8">
            <label for="subtitle" data-i18n="subtitleLabel">Subtitle</label>
            <input id="subtitle" value="with you" maxlength="24">
            <label for="bg" data-i18n="background">Background</label>
            <input id="bg" type="color" value="#ffffff">
            <label for="gap" data-i18n="gap">Photo spacing</label>
            <input id="gap" type="range" min="0" max="20" value="8">
            <label><input id="gray" type="checkbox"> <span data-i18n="grayscale">Black and white</span></label>
            <button id="shuffle" data-i18n="shuffle">Shuffle photos</button>
            <button id="clear" data-i18n="clear">Clear photos</button>
            <button id="download" class="primary" data-i18n="download" disabled>Download image (PNG)</button>
            <p><small data-i18n="footer">2400 × 3000 px. Photos are processed on your device.</small></p>
        </aside>
        <section>
            <div id="poster">
                <canvas id="canvas" width="2400" height="3000"></canvas>
            </div>
        </section>
    </main>
    <dialog id="crop-editor" aria-labelledby="crop-title">
        <h2 id="crop-title" data-i18n="editPhoto">Edit photo</h2>
        <canvas id="crop-preview"></canvas>
        <label for="crop-zoom" data-i18n="zoom">Zoom</label>
        <input id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1">
        <label for="crop-pan" data-i18n="horizontalPosition">Horizontal position</label>
        <input id="crop-pan" type="range" min="-100" max="100" value="0">
        <button id="crop-reset" type="button" data-i18n="resetCrop">Reset</button>
        <form method="dialog">
            <button class="primary" data-i18n="done">Done</button>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>

</html>
